name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - name: Install benchmark dependencies
        run: sudo apt-get update && sudo apt-get install --yes ripgrep
      - run: dart pub get
      - run: dart analyze --fatal-infos
      - run: dart format --output=none --set-exit-if-changed .
      - run: dart test
      - run: dart run benchmarks/perf.dart --compare benchmarks/perf_baseline.json
      - run: dart run benchmarks/usefulness/run.dart --check --no-write
      - run: dart run benchmarks/affected_tests.dart
      - run: dart run benchmarks/route_mutations.dart

  # A tag is only a release once the gates pass on the tagged tree. This job
  # exists because the manual step was not happening: v0.9.7 stayed "Latest"
  # while ten tags shipped past it, so the repo advertised a two-month-old
  # version of itself.
  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Tag must match the version the code reports
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pubspec="$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | head -1)"
          if [ "$tag" != "$pubspec" ]; then
            echo "tag $GITHUB_REF_NAME does not match pubspec version $pubspec" >&2
            exit 1
          fi
      - name: Release notes come from CHANGELOG.md, or there is no release
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## "v"( |$)" { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "no CHANGELOG.md section for $version - write one before tagging" >&2
            exit 1
          fi
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md
