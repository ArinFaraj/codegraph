name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - run: dart pub get
      - run: dart analyze --fatal-infos
      - run: dart format --output=none --set-exit-if-changed lib bin test tool
      - run: dart test

  # A tag is only a release once the gates pass on the tagged tree, and the
  # release notes are the CHANGELOG section for that version.
  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Tag must match the version the code reports
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pubspec="$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | head -1)"
          code="$(sed -n "s/^const codegraphVersion = '\(.*\)';/\1/p" lib/src/version.dart)"
          if [ "$tag" != "$pubspec" ] || [ "$tag" != "$code" ]; then
            echo "tag $GITHUB_REF_NAME, pubspec $pubspec and lib/src/version.dart $code must match" >&2
            exit 1
          fi
      - name: Release notes come from CHANGELOG.md, or there is no release
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## "v"( |$)" { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "no CHANGELOG.md section for $version - write one before tagging" >&2
            exit 1
          fi
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md
